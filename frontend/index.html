<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RaceOracle — Elite Race Intelligence</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://unpkg.com/framer-motion@11/dist/framer-motion.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:       #FAFAF8;
  --bg2:      #FFFFFF;
  --bg3:      #F5F3EE;
  --bg4:      #EDE9E0;
  --gold:     #B8860B;
  --gold2:    #C9A84C;
  --gold3:    #E8C96A;
  --goldLight:#FFF8E7;
  --crimson:  #8B1A2E;
  --crimson2: #C02040;
  --crimsonLight:#FFF0F2;
  --emerald:  #1A6B3C;
  --emerald2: #27A85F;
  --emeraldLight:#F0FFF6;
  --text:     #1A1612;
  --text2:    #5C4F3A;
  --text3:    #9C8B70;
  --border:   #E8E0D0;
  --borderH:  #C9A84C;
  --shadow:   0 1px 3px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.04);
  --shadowHov:0 4px 20px rgba(0,0,0,0.10), 0 1px 4px rgba(0,0,0,0.06);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
  position:relative;
  background:#FAFAF8;
  color:var(--text);
}

/* Background image with very light overlay */
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:url('./src/images/horses.webp');
  background-size:cover;background-position:center 35%;background-repeat:no-repeat;
  opacity:0.18;
}
body::after{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,
    rgba(250,250,248,0.82) 0%,
    rgba(250,250,248,0.65) 40%,
    rgba(250,250,248,0.82) 100%);
}

/* Racing stripe */
@keyframes stripeMove{from{background-position:0 0}to{background-position:80px 0}}
.racing-stripe{
  height:3px;position:relative;z-index:10;
  background:repeating-linear-gradient(90deg,
    var(--gold) 0,var(--gold) 20px,transparent 20px,transparent 40px,
    var(--crimson2) 40px,var(--crimson2) 60px,transparent 60px,transparent 80px);
  animation:stripeMove 1.2s linear infinite;
}

/* Topbar */
.topbar{
  position:sticky;top:0;z-index:100;
  background:rgba(255,255,255,0.92);
  border-bottom:1px solid var(--border);
  padding:0 32px;display:flex;align-items:center;justify-content:space-between;
  height:72px;backdrop-filter:blur(16px);
  box-shadow:0 1px 12px rgba(0,0,0,0.06);
}
.logo-wrap{display:flex;align-items:center;gap:16px;}
.logo-mark{width:52px;height:52px;flex-shrink:0;}
.logo-text{font-family:'Playfair Display',serif;font-size:23px;font-weight:700;letter-spacing:0.3px;color:var(--gold);}
.logo-text span{color:var(--crimson2);}
.logo-tagline{font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:var(--text3);margin-top:2px;}
.topbar-right{display:flex;align-items:center;gap:12px;}


.btn-gold{padding:10px 22px;border-radius:7px;background:linear-gradient(135deg,var(--gold2) 0%,var(--gold) 100%);color:#fff;font-weight:600;font-size:13px;border:none;cursor:pointer;letter-spacing:0.02em;font-family:'Inter',sans-serif;box-shadow:0 2px 8px rgba(184,134,11,0.25);}
.btn-gold:hover:not(:disabled){background:linear-gradient(135deg,var(--gold3) 0%,var(--gold2) 100%);box-shadow:0 4px 16px rgba(184,134,11,0.3);}
.btn-gold:disabled{opacity:0.5;cursor:not-allowed;}
.btn-ghost{padding:10px 16px;border-radius:7px;background:var(--bg3);color:var(--text2);border:1px solid var(--border);font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;}
.btn-ghost:hover{background:var(--bg4);color:var(--text);}

/* Layout */
.layout{display:flex;position:relative;z-index:1;min-height:calc(100vh - 72px);}

/* Sidebar */
.sidebar{width:262px;flex-shrink:0;background:rgba(255,255,255,0.85);border-right:1px solid var(--border);padding:24px 0;backdrop-filter:blur(8px);}
.s-label{font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:var(--text3);padding:0 20px 10px;font-weight:600;}
.race-item{padding:12px 20px;cursor:pointer;border-left:2px solid transparent;transition:all 0.15s;}
.race-item:hover{background:var(--goldLight);border-left-color:var(--gold3);}
.race-item.active{background:var(--goldLight);border-left-color:var(--gold2);}
.ri-name{font-family:'Playfair Display',serif;font-size:14px;color:var(--text);margin-bottom:3px;font-weight:600;}
.ri-meta{font-size:11px;color:var(--text3);}
.ri-badge{display:inline-block;margin-top:6px;font-size:9px;letter-spacing:0.12em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:var(--goldLight);color:var(--gold);border:1px solid #E8D49A;font-weight:600;}
.divider{height:1px;margin:16px 20px;background:var(--border);}
.s-hint{padding:12px 20px;font-size:11px;color:var(--text3);line-height:1.7;}
.s-hint code{color:var(--gold);font-size:10px;font-weight:600;}

/* Main */
.main{flex:1;padding:28px 36px;overflow-y:auto;}
.sec-lbl{font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:var(--text3);margin-bottom:14px;font-weight:600;}

/* Metrics */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px;}
.metric{
  background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px;
  position:relative;overflow:hidden;
  box-shadow:var(--shadow);transition:box-shadow 0.2s,transform 0.2s;
}
.metric:hover{box-shadow:var(--shadowHov);transform:translateY(-1px);}
.metric::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold2),var(--crimson2));opacity:0.7;}
.m-lbl{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3);margin-bottom:8px;font-weight:500;}
.m-val{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;line-height:1;color:var(--gold);}
.m-val.sm{font-size:15px;padding-top:4px;line-height:1.35;color:var(--text);}
.m-val.green{color:var(--emerald);}
.m-sub{font-size:11px;color:var(--text3);margin-top:6px;}

/* Horse cards */
.horses{display:flex;flex-direction:column;gap:10px;margin-bottom:28px;}
.hcard{
  background:#fff;border:1px solid var(--border);border-radius:12px;
  padding:18px 22px;cursor:pointer;position:relative;overflow:hidden;
  box-shadow:var(--shadow);transition:box-shadow 0.2s;
}
.hcard.exp{border-color:var(--gold2);box-shadow:0 0 0 3px rgba(201,168,76,0.1),var(--shadow);}
.hcard.tp{border-color:#E8D49A;background:var(--goldLight);}
.tp-bar{position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--gold2),var(--crimson2));border-radius:0;}
.tp-lbl{font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:8px;}
.hdr{display:flex;align-items:center;gap:14px;margin-bottom:12px;}
.hnum{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:14px;font-weight:700;border:1.5px solid var(--border);color:var(--text3);background:var(--bg3);}
.hnum.g{background:var(--goldLight);border-color:var(--gold3);color:var(--gold);}
.hname{font-family:'Playfair Display',serif;font-size:17px;font-weight:700;color:var(--text);}
.hmeta{font-size:12px;color:var(--text3);margin-top:2px;}
.badges{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end;align-items:center;}
.badge{font-size:10px;padding:4px 10px;border-radius:20px;font-weight:600;letter-spacing:0.04em;border:1px solid;white-space:nowrap;}
.bg{background:var(--goldLight);color:var(--gold);border-color:#E8D49A;}
.br{background:var(--crimsonLight);color:var(--crimson2);border-color:#FFCCD5;}
.ba{background:#FFF8F0;color:#B05A00;border-color:#FFD9B3;}
.bk{background:var(--bg3);color:var(--text3);border-color:var(--border);}

/* Prob bars */
.prow{display:flex;align-items:center;gap:12px;margin-bottom:7px;}
.plbl{font-size:11px;color:var(--text3);width:50px;flex-shrink:0;font-weight:500;}
.ptrack{flex:1;height:6px;background:var(--bg4);border-radius:3px;overflow:hidden;}
.pfill{height:100%;border-radius:3px;}
.ppct{font-size:12px;font-weight:700;width:42px;text-align:right;flex-shrink:0;}

/* Expanded details */
.det{margin-top:16px;padding-top:16px;border-top:1px solid var(--border);display:grid;grid-template-columns:1fr 1fr;gap:20px;overflow:hidden;}
.dtitle{font-size:9px;letter-spacing:0.18em;text-transform:uppercase;color:var(--text3);margin-bottom:10px;font-weight:600;}
.srow{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.slbl{font-size:11px;color:var(--text2);width:130px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.strack{flex:1;height:4px;background:var(--bg4);border-radius:2px;overflow:hidden;}
.sfill{height:100%;border-radius:2px;}
.sval{font-size:10px;width:36px;text-align:right;font-weight:600;}
.mws{display:flex;gap:8px;margin-top:8px;}
.mw{flex:1;border-radius:8px;padding:10px;text-align:center;border:1px solid var(--border);background:var(--bg3);}
.mwv{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;color:var(--gold);}
.mwl{font-size:10px;color:var(--text3);margin-top:2px;letter-spacing:0.08em;text-transform:uppercase;font-weight:500;}
.nitem{display:flex;gap:8px;align-items:flex-start;margin-bottom:6px;}
.ndot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:5px;}
.ntxt{font-size:12px;color:var(--text2);line-height:1.6;}
.hhint{font-size:11px;color:var(--text3);margin-top:9px;}

/* News panel */
.news-evidence-btn{margin-top:12px;width:100%;padding:9px 14px;border-radius:8px;background:var(--bg3);border:1px dashed var(--border);color:var(--gold);font-size:11px;cursor:pointer;letter-spacing:0.04em;font-family:'Inter',sans-serif;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:600;transition:all 0.15s;}
.news-evidence-btn:hover{background:var(--goldLight);border-color:var(--gold3);}
.news-panel{margin-top:10px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:14px 16px;}
.news-panel-title{font-size:9px;letter-spacing:0.18em;text-transform:uppercase;color:var(--text3);margin-bottom:10px;font-weight:600;}
.article-item{padding:9px 0;border-bottom:1px solid var(--border);}
.article-item:last-child{border-bottom:none;}
.article-source{font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:var(--gold);font-weight:700;}
.article-date{font-size:9px;color:var(--text3);margin-left:6px;}
.article-title{font-size:12px;color:var(--text);margin-top:3px;line-height:1.45;font-weight:500;}
.article-summary{font-size:11px;color:var(--text3);margin-top:3px;line-height:1.5;}
.article-empty{font-size:11px;color:var(--text3);text-align:center;padding:10px 0;}
.news-loading{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text3);padding:6px 0;}
.news-loading-ring{width:12px;height:12px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--gold);}

/* Bottom panels */
.panels{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.panel{background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px 22px;box-shadow:var(--shadow);}
.ptitle{font-size:9px;letter-spacing:0.18em;text-transform:uppercase;color:var(--text3);margin-bottom:14px;font-weight:600;}
.arow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;color:var(--text2);}
.arow:last-child{border-bottom:none;}
.frow{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.fname{font-size:12px;color:var(--text2);width:110px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ftrack{flex:1;height:5px;background:var(--bg4);border-radius:3px;overflow:hidden;}
.ffill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--gold2),var(--crimson2));}
.fpct{font-size:12px;font-weight:700;color:var(--gold);width:38px;text-align:right;}

/* Loading */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:360px;gap:20px;}
.lring{width:48px;height:48px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--gold);}
.ltxt{font-family:'Playfair Display',serif;font-size:16px;color:var(--gold);}
.ebox{border:1px solid #FFCCD5;background:var(--crimsonLight);border-radius:10px;padding:14px 18px;font-size:13px;color:var(--crimson2);margin-bottom:22px;}

@media(max-width:1100px){.metrics{grid-template-columns:repeat(2,1fr)}.panels{grid-template-columns:1fr}}
@media(max-width:800px){.sidebar{display:none}.det{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback,useRef}=React;
const {motion,AnimatePresence}=window.Motion??window.framerMotion;
const BASE="http://localhost:8000/api/v1";

async function apiFetch(path,method="GET",body=null){
  const res=await fetch(BASE+path,{method,headers:{"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
  if(!res.ok){const e=await res.json().catch(()=>({detail:res.statusText}));throw new Error(e.detail||"API error");}
  return res.json();
}

/* ── Real horse photo via Wikipedia ──────────────────────────────────────── */
function useHorsePhoto(name){
  const [url,setUrl]=useState(null);
  useEffect(()=>{
    if(!name)return;
    setUrl(null);
    fetch('https://en.wikipedia.org/w/api.php?action=query&titles='+encodeURIComponent(name)+'&prop=pageimages&format=json&pithumbsize=400&origin=*')
      .then(r=>r.json()).then(d=>{
        const p=Object.values(d?.query?.pages||{})[0];
        if(p?.thumbnail?.source){setUrl(p.thumbnail.source);return;}
        return fetch('https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch='+encodeURIComponent(name+' racehorse')+'&format=json&origin=*')
          .then(r=>r.json()).then(d2=>{
            const t=(d2?.query?.search||[])[0]?.title;
            if(!t)return;
            return fetch('https://en.wikipedia.org/w/api.php?action=query&titles='+encodeURIComponent(t)+'&prop=pageimages&format=json&pithumbsize=400&origin=*')
              .then(r=>r.json()).then(d3=>{
                const p2=Object.values(d3?.query?.pages||{})[0];
                if(p2?.thumbnail?.source)setUrl(p2.thumbnail.source);
              });
          });
      }).catch(()=>{});
  },[name]);
  return url;
}

/* Colour palette for placeholder silhouettes — cycles per horse index */
const HORSE_COLORS=[
  ['#8B4513','#D2691E'],['#1a1a1a','#444'],['#C0C0C0','#999'],
  ['#8B0000','#CC3333'],['#2F4F4F','#4A7A7A'],['#4B0082','#7B52AB'],
];

function HorsePhoto({name,index=0}){
  const url=useHorsePhoto(name);
  const [failed,setFailed]=useState(false);
  const [darkBg,lightBg]=HORSE_COLORS[index%HORSE_COLORS.length];

  return(
    <div style={{width:100,height:100,flexShrink:0,borderRadius:10,overflow:'hidden',
      border:'1px solid var(--border)',position:'relative',
      background:url&&!failed?'var(--bg3)':darkBg,
      display:'flex',alignItems:'center',justifyContent:'center'}}>
      {url&&!failed?(
        <motion.img src={url} alt={name}
          initial={{opacity:0}} animate={{opacity:1}} transition={{duration:0.4}}
          style={{position:'absolute',inset:0,width:'100%',height:'100%',objectFit:'cover'}}
          onError={()=>setFailed(true)}
        />
      ):(
        /* Elegant placeholder with horse silhouette SVG */
        <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',width:'100%',height:'100%',
          background:`linear-gradient(135deg,${darkBg} 0%,${lightBg} 100%)`}}>
          <svg width="56" height="48" viewBox="0 0 100 86" fill="none">
            <path fill="rgba(255,255,255,0.85)" d="M20 62C16 56 18 48 25 45C32 42 42 43 48 48L54 42C50 34 52 24 60 19C66 15 74 16 78 21C81 25 80 30 76 33L80 37C84 35 88 37 89 41C90 45 87 49 83 49L78 54C76 60 70 64 63 63L57 68C60 74 57 80 51 82C46 84 41 81 40 76L32 80C30 85 24 87 19 84C16 82 15 78 17 75L12 72C8 74 4 72 3 68C2 64 5 60 9 60Z"/>
            <path fill="rgba(255,255,255,0.6)" d="M62 14Q70 8 74 14Q68 15 64 20Q60 16 62 14Z"/>
            <path stroke="rgba(255,255,255,0.7)" strokeWidth="3.5" strokeLinecap="round" d="M50 74Q46 83 42 92M40 77Q36 86 34 94M14 70Q18 79 20 88M8 67Q10 77 8 86"/>
          </svg>
          <div style={{fontSize:9,color:'rgba(255,255,255,0.8)',fontWeight:700,
            letterSpacing:'0.1em',textTransform:'uppercase',marginTop:3,textAlign:'center',padding:'0 4px',lineHeight:1.2}}>
            {name.length>12?name.split(' ')[0]:name}
          </div>
        </div>
      )}
      {/* Name overlay when real photo is shown */}
      {url&&!failed&&(
        <div style={{position:'absolute',bottom:0,left:0,right:0,
          background:'linear-gradient(transparent,rgba(0,0,0,0.65))',
          padding:'14px 6px 4px',pointerEvents:'none'}}>
          <span style={{fontSize:9,color:'#fff',fontWeight:700,letterSpacing:'0.06em',textTransform:'uppercase'}}>
            {name.split(' ')[0]}
          </span>
        </div>
      )}
    </div>
  );
}

/* ── Probability bar ─────────────────────────────────────────────────────── */
function ProbBar({label,pct,color,delay=0}){
  return(
    <div className="prow">
      <span className="p-lbl">{label}</span>
      <div className="p-track">
        <motion.div className="p-fill" style={{background:color}}
          initial={{width:0}} animate={{width:pct+'%'}}
          transition={{duration:0.9,delay,ease:[0.22,1,0.36,1]}}/>
      </div>
      <motion.span className="p-pct" style={{color}}
        initial={{opacity:0}} animate={{opacity:1}} transition={{delay:delay+0.4}}
      >{pct}%</motion.span>
    </div>
  );
}

/* ── SHAP chart ──────────────────────────────────────────────────────────── */
function ShapSection({drivers=[],risks=[]}){
  const all=[...drivers,...risks];
  const mx=Math.max(...all.map(d=>Math.abs(d.impact)),1);
  return(
    <div>
      <div className="d-title">SHAP — probability drivers</div>
      {drivers.slice(0,4).map((d,i)=>(
        <div className="s-row" key={i}>
          <span className="s-lbl2">{d.feature.replace(/_/g,' ')}</span>
          <div className="s-track">
            <motion.div className="s-fill" style={{background:'linear-gradient(90deg,#1A6B3C,#52D98A)'}}
              initial={{width:0}} animate={{width:((Math.abs(d.impact)/mx)*100)+'%'}} transition={{duration:0.6,delay:i*0.05}}/>
          </div>
          <span className="s-val" style={{color:'#1A6B3C'}}>+{d.impact.toFixed(1)}</span>
        </div>
      ))}
      {risks.slice(0,3).map((r,i)=>(
        <div className="s-row" key={i}>
          <span className="s-lbl2">{r.feature.replace(/_/g,' ')}</span>
          <div className="s-track">
            <motion.div className="s-fill" style={{background:'linear-gradient(90deg,#C02040,#FF6080)'}}
              initial={{width:0}} animate={{width:((Math.abs(r.impact)/mx)*100)+'%'}} transition={{duration:0.6,delay:i*0.05}}/>
          </div>
          <span className="s-val" style={{color:'#C02040'}}>{r.impact.toFixed(1)}</span>
        </div>
      ))}
    </div>
  );
}

/* ── News evidence panel ─────────────────────────────────────────────────── */
function NewsEvidence({horseName,trainerName}){
  const [open,setOpen]=useState(false);
  const [loading,setLoading]=useState(false);
  const [data,setData]=useState(null);
  const [err,setErr]=useState(null);

  const toggle=async(e)=>{
    e.stopPropagation();
    if(open){setOpen(false);return;}
    setOpen(true);
    if(data)return;
    setLoading(true);setErr(null);
    try{
      const res=await apiFetch('/news','POST',{horse_name:horseName,trainer_name:trainerName||'',race_info:'upcoming race',use_cache:true});
      setData(res);
    }catch(ex){setErr(ex.message);}
    finally{setLoading(false);}
  };

  return(
    <div onClick={e=>e.stopPropagation()}>
      <button className="news-btn" onClick={toggle}>
        {open?'▲ Hide source articles':'▼ View news evidence & sources'}
      </button>
      <AnimatePresence>
        {open&&(
          <motion.div className="news-panel"
            initial={{height:0,opacity:0}} animate={{height:'auto',opacity:1}} exit={{height:0,opacity:0}}
            transition={{duration:0.25}} style={{overflow:'hidden'}}>
            <div className="np-title">📰 Source articles analysed by AI</div>
            {loading&&(
              <div style={{display:'flex',alignItems:'center',gap:8,fontSize:11,color:'var(--text3)',padding:'6px 0'}}>
                <motion.div style={{width:12,height:12,borderRadius:'50%',border:'2px solid var(--border)',borderTopColor:'var(--gold2)'}}
                  animate={{rotate:360}} transition={{duration:0.8,repeat:Infinity,ease:'linear'}}/>
                Fetching articles…
              </div>
            )}
            {err&&<div style={{fontSize:11,color:'var(--crimson2)',padding:'6px 0'}}>⚠ {err}</div>}
            {data&&(data.articles||[]).map((a,i)=>(
              <div className="art" key={i}>
                <span className="art-src">{a.source}</span>
                <span className="art-date"> · {a.published?.slice(0,16)}</span>
                <div className="art-title">{a.title}</div>
                {a.summary&&<div className="art-body">{a.summary}</div>}
              </div>
            ))}
            {data&&!(data.articles||[]).length&&<div className="art-empty">No recent articles found.</div>}
            {data&&<div style={{marginTop:10,paddingTop:10,borderTop:'1px solid var(--border)',fontSize:11,color:'var(--text2)',lineHeight:1.6}}>
              <strong style={{color:'var(--gold)'}}>AI summary: </strong>{data.summary}
            </div>}
          </motion.div>
        )}
      </AnimatePresence>
    </div>
  );
}

/* ── Horse card ──────────────────────────────────────────────────────────── */
function HorseCard({horse,expanded,onToggle,index}){
  const isTop=horse.rank===1;
  const wc=horse.win_prob>=28?'var(--emerald2)':horse.win_prob>=18?'#B05A00':'var(--text3)';
  return(
    <motion.div className={`hcard ${expanded?'exp':''} ${isTop?'top':''}`} onClick={onToggle}
      layout
      initial={{opacity:0,y:14}} animate={{opacity:1,y:0}}
      transition={{duration:0.35,delay:index*0.06,ease:[0.22,1,0.36,1]}}
      whileHover={{y:-2,boxShadow:'var(--shadowH)'}} whileTap={{scale:0.998}}
    >
      {isTop&&<div className="tp-bar"/>}
      {isTop&&<div className="tp-lbl">★ AI Top Selection</div>}

      {/* Photo + info row */}
      <div style={{display:'flex',gap:14,alignItems:'flex-start'}}>
        <HorsePhoto name={horse.name} index={index}/>
        <div style={{flex:1,minWidth:0}}>
          <div className="hdr">
            <motion.div className={`num ${isTop?'g':''}`}
              initial={{scale:0}} animate={{scale:1}}
              transition={{delay:index*0.06+0.1,type:'spring',stiffness:300}}
            >{horse.rank}</motion.div>
            <div style={{flex:1}}>
              <div className="h-name">{horse.name}</div>
              <div className="h-meta">{horse.jockey} · {horse.trainer} · Form: {horse.form}</div>
            </div>
            <div className="badges">
              {isTop&&<span className="badge b-gold">Top pick</span>}
              {(horse.risk_flags||[]).filter(f=>f.severity==='critical'||f.severity==='high').map((f,i)=>(
                <span key={i} className={'badge '+(f.severity==='critical'?'b-red':'b-amber')}>
                  {f.label.replace(/[🔴🟡🟠⚪]/g,'').trim()}
                </span>
              ))}
              <span className="badge b-gray">{horse.confidence}% conf</span>
            </div>
          </div>
          <ProbBar label="Win"   pct={horse.win_prob}  color={wc}                    delay={index*0.06}/>
          <ProbBar label="Top 2" pct={horse.top2_prob} color="var(--gold2)"          delay={index*0.06+0.1}/>
          <ProbBar label="Top 3" pct={horse.top3_prob} color="var(--gold3)"          delay={index*0.06+0.2}/>
        </div>
      </div>

      <AnimatePresence>
        {expanded&&(
          <motion.div initial={{height:0,opacity:0}} animate={{height:'auto',opacity:1}}
            exit={{height:0,opacity:0}} transition={{duration:0.28,ease:[0.22,1,0.36,1]}}
            style={{overflow:'hidden'}}>
            <div className="det">
              <ShapSection drivers={horse.top_drivers||[]} risks={horse.top_risks||[]}/>
              <div>
                <div className="d-title">Signal trust</div>
                <div className="mw-wrap">
                  {['structured','odds','news'].map((k,i)=>(
                    <motion.div className="mw-box" key={k}
                      initial={{opacity:0,y:6}} animate={{opacity:1,y:0}} transition={{delay:i*0.05}}>
                      <div className="mw-val">{(horse.modal_weights||{})[k]||33}%</div>
                      <div className="mw-lbl">{k}</div>
                    </motion.div>
                  ))}
                </div>
                {((horse.risk_flags||[]).length>0||horse.news_summary)&&(
                  <div style={{marginTop:14}}>
                    <div className="d-title">Intelligence flags</div>
                    {(horse.risk_flags||[]).map((f,i)=>(
                      <div className="n-item" key={i}>
                        <div className="n-dot" style={{background:f.severity==='critical'?'var(--crimson2)':f.severity==='high'?'#B05A00':'var(--text3)'}}/>
                        <span className="n-txt">{f.label.replace(/[🔴🟡🟠⚪]/g,'').trim()}</span>
                      </div>
                    ))}
                    {horse.news_summary&&(
                      <div className="n-item">
                        <div className="n-dot" style={{background:'var(--text3)'}}/>
                        <span className="n-txt">{horse.news_summary}</span>
                      </div>
                    )}
                  </div>
                )}
              </div>
            </div>
            <NewsEvidence horseName={horse.name} trainerName={horse.trainer}/>
          </motion.div>
        )}
      </AnimatePresence>
      {!expanded&&<div className="h-hint">Click to expand · SHAP analysis · signal trust · news evidence</div>}
    </motion.div>
  );
}

/* ── Quick Predict sidebar component ─────────────────────────────────────── */
function QuickPredict(){
  const [horses,setHorses]=useState([{name:'',jockey:'',trainer:'',form:'',age:5,weight_lbs:126}]);
  const [track,setTrack]=useState('Royal Ascot');
  const [going,setGoing]=useState('Good');
  const [result,setResult]=useState(null);
  const [loading,setLoading]=useState(false);
  const [err,setErr]=useState(null);

  const addHorse=()=>{
    if(horses.length>=12)return;
    setHorses(h=>[...h,{name:'',jockey:'',trainer:'',form:'',age:5,weight_lbs:126}]);
  };
  const removeHorse=(i)=>setHorses(h=>h.filter((_,j)=>j!==i));
  const updateHorse=(i,field,val)=>setHorses(h=>h.map((ho,j)=>j===i?{...ho,[field]:val}:ho));

  const run=async()=>{
    const valid=horses.filter(h=>h.name.trim());
    if(valid.length<2){setErr('Enter at least 2 horse names');return;}
    setLoading(true);setErr(null);setResult(null);
    try{
      const body={
        horses:valid.map(h=>({
          name:h.name.trim(),jockey:h.jockey||'Unknown',trainer:h.trainer||'Unknown',
          form:h.form||'-',age:Number(h.age)||5,weight_lbs:Number(h.weight_lbs)||126,
          days_since_last_run:21,jockey_win_rate:0.12,trainer_win_rate:0.12,
          speed_ratings:[],going_history:[],distance_history:[],
          track_wins:0,track_runs:1,career_wins:0,career_runs:1,
        })),
        race:{race_id:'quick_'+Date.now(),race_name:track+' — Custom Race',
          track,going,surface:'Turf',distance_furlongs:10},
        fetch_news:false,
      };
      const res=await apiFetch('/predict','POST',body);
      setResult(res);
    }catch(ex){setErr(ex.message);}
    finally{setLoading(false);}
  };

  return(
    <div style={{padding:'0 0 8px'}}>
      <div className="s-label" style={{paddingTop:8}}>Quick Prediction</div>
      <div style={{padding:'0 14px'}}>
        {/* Track & Going */}
        <div style={{marginBottom:8}}>
          <input value={track} onChange={e=>setTrack(e.target.value)} placeholder="Track name"
            style={{width:'100%',padding:'7px 10px',borderRadius:6,border:'1px solid var(--border)',
              background:'var(--bg3)',color:'var(--text)',fontSize:11,fontFamily:'Inter,sans-serif',marginBottom:5}}/>
          <select value={going} onChange={e=>setGoing(e.target.value)}
            style={{width:'100%',padding:'7px 10px',borderRadius:6,border:'1px solid var(--border)',
              background:'var(--bg3)',color:'var(--text)',fontSize:11,fontFamily:'Inter,sans-serif'}}>
            {['Firm','Good','Good-Soft','Soft','Heavy'].map(g=><option key={g}>{g}</option>)}
          </select>
        </div>

        {/* Horse rows */}
        <div style={{marginBottom:8,maxHeight:220,overflowY:'auto'}}>
          {horses.map((h,i)=>(
            <div key={i} style={{display:'flex',gap:5,marginBottom:5,alignItems:'center'}}>
              <div style={{width:18,height:18,borderRadius:'50%',background:'var(--bg4)',
                display:'flex',alignItems:'center',justifyContent:'center',
                fontSize:9,color:'var(--text3)',flexShrink:0,fontWeight:700}}>{i+1}</div>
              <input value={h.name} onChange={e=>updateHorse(i,'name',e.target.value)}
                placeholder="Horse name *"
                style={{flex:1,padding:'6px 8px',borderRadius:6,border:'1px solid var(--border)',
                  background:'var(--bg2)',color:'var(--text)',fontSize:11,fontFamily:'Inter,sans-serif'}}/>
              {horses.length>2&&(
                <button onClick={()=>removeHorse(i)}
                  style={{width:20,height:20,borderRadius:'50%',border:'1px solid var(--border)',
                    background:'var(--crimsonL)',color:'var(--crimson2)',cursor:'pointer',
                    fontSize:11,lineHeight:1,padding:0,flexShrink:0}}>×</button>
              )}
            </div>
          ))}
        </div>

        <button onClick={addHorse} disabled={horses.length>=12}
          style={{width:'100%',padding:'6px',borderRadius:6,border:'1px dashed var(--border)',
            background:'var(--bg3)',color:'var(--text3)',fontSize:11,cursor:'pointer',
            fontFamily:'Inter,sans-serif',marginBottom:8}}>
          + Add horse
        </button>

        {err&&<div style={{fontSize:11,color:'var(--crimson2)',marginBottom:6,padding:'5px 8px',
          background:'var(--crimsonL)',borderRadius:5,border:'1px solid #FFCCD5'}}>{err}</div>}

        <button onClick={run} disabled={loading}
          style={{width:'100%',padding:'9px',borderRadius:7,border:'none',
            background:'linear-gradient(135deg,var(--gold2),var(--gold))',
            color:'#fff',fontWeight:700,fontSize:12,cursor:'pointer',
            fontFamily:'Inter,sans-serif',letterSpacing:'0.03em',
            opacity:loading?0.7:1}}>
          {loading?'Predicting…':'Run Prediction →'}
        </button>

        {/* Inline results */}
        <AnimatePresence>
          {result&&(
            <motion.div initial={{opacity:0,y:6}} animate={{opacity:1,y:0}} exit={{opacity:0}}
              style={{marginTop:10,background:'var(--bg3)',borderRadius:8,
                border:'1px solid var(--border)',padding:'10px 12px'}}>
              <div style={{fontSize:9,letterSpacing:'0.15em',textTransform:'uppercase',
                color:'var(--goldDim)',fontWeight:600,marginBottom:8}}>Results</div>
              {result.horses.map((h,i)=>(
                <div key={i} style={{display:'flex',alignItems:'center',gap:8,
                  padding:'5px 0',borderBottom:i<result.horses.length-1?'1px solid var(--border)':'none'}}>
                  <div style={{width:20,height:20,borderRadius:'50%',flexShrink:0,
                    background:i===0?'var(--goldL)':'var(--bg4)',
                    border:'1px solid '+(i===0?'var(--gold3)':'var(--border)'),
                    display:'flex',alignItems:'center',justifyContent:'center',
                    fontSize:9,fontWeight:700,color:i===0?'var(--gold)':'var(--text3)'}}>
                    {h.rank}
                  </div>
                  <span style={{flex:1,fontSize:12,fontWeight:i===0?700:400,
                    color:i===0?'var(--text)':'var(--text2)',
                    fontFamily:i===0?'Playfair Display,serif':'Inter,sans-serif'}}>
                    {h.name}
                  </span>
                  <span style={{fontSize:12,fontWeight:700,
                    color:i===0?'var(--emerald2)':'var(--text3)'}}>
                    {h.win_prob}%
                  </span>
                </div>
              ))}
              <div style={{marginTop:8,fontSize:10,color:'var(--text3)',textAlign:'center'}}>
                {result.inference_ms}ms · {result.field_size} runners
              </div>
            </motion.div>
          )}
        </AnimatePresence>
      </div>
    </div>
  );
}

/* ── Sidebar ─────────────────────────────────────────────────────────────── */
const RACES=[{id:'demo',label:'Royal Ascot — Race 3',meta:'1m4f · Good to Firm',badge:'Live Demo'}];
const ACCURACY=[
  ['Top-pick accuracy','38.6%','var(--emerald)'],
  ['Top-2 accuracy','~62%','var(--emerald)'],
  ['vs random baseline','3.8×','var(--gold)'],
  ['Training races','2,706','var(--text2)'],
  ['Dataset period','Sep–Dec 2020','var(--text3)'],
  ['Model version','v1-surgical','var(--text3)'],
];

/* ── App ─────────────────────────────────────────────────────────────────── */
function App(){
  const [race,setRace]=useState(null);
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState(null);
  const [expanded,setExpanded]=useState(null);
  const [active,setActive]=useState('demo');

  const loadDemo=useCallback(async()=>{
    setLoading(true);setError(null);setExpanded(null);
    try{setRace(await apiFetch('/predict/demo'));}
    catch(e){setError(e.message);}
    finally{setLoading(false);}
  },[]);

  useEffect(()=>{loadDemo();},[]);

  const horses=race?.horses??[];
  const maxWin=horses.length?Math.max(...horses.map(h=>h.win_prob)):1;

  return(
    <div style={{minHeight:'100vh',position:'relative',zIndex:1}}>
      <div className="stripe"/>

      {/* Topbar */}
      <motion.div className="topbar" initial={{y:-20,opacity:0}} animate={{y:0,opacity:1}} transition={{duration:0.4}}>
        <div className="logo-wrap">
          <div style={{width:42,height:42,background:'linear-gradient(135deg,#C9A84C,#B8860B)',
            borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',
            fontSize:22,flexShrink:0}}>🏇</div>
          <div>
            <div className="logo-text">Race<span>Oracle</span></div>
            <div className="logo-tag">Elite AI Race Intelligence</div>
          </div>
        </div>
        <div className="nav-right">
          <motion.button className="btn-secondary" onClick={loadDemo} disabled={loading}
            whileHover={{scale:1.02}} whileTap={{scale:0.98}}>↺ Refresh</motion.button>
          <motion.button className="btn-primary" onClick={loadDemo} disabled={loading}
            whileHover={{scale:1.02,boxShadow:'0 6px 20px rgba(184,134,11,0.3)'}} whileTap={{scale:0.98}}>
            {loading?'Analysing…':'Run Prediction'}
          </motion.button>
        </div>
      </motion.div>

      <div className="layout">
        {/* Sidebar */}
        <motion.div className="sidebar" initial={{x:-20,opacity:0}} animate={{x:0,opacity:1}} transition={{delay:0.1}}>

          {/* Race schedule */}
          <div className="s-label">Race Schedule</div>
          {RACES.map(r=>(
            <div key={r.id} className={'r-item'+(active===r.id?' on':'')}
              onClick={()=>{setActive(r.id);loadDemo();}}>
              <div className="r-name">{r.label}</div>
              <div className="r-meta">{r.meta}</div>
              <span className="r-badge">{r.badge}</span>
            </div>
          ))}

          <div className="s-div"/>

          {/* Quick predict form */}
          <QuickPredict/>

          <div className="s-div"/>

          <div className="s-hint">POST to <code>/api/v1/predict</code> for full race analysis.</div>
        </motion.div>

        {/* Main content */}
        <div className="main">
          {error&&<div className="err-box">⚠ {error} — ensure the API is running: uvicorn backend.api.main:app --port 8000</div>}

          {loading&&(
            <div className="loading">
              <motion.div className="l-ring" animate={{rotate:360}} transition={{duration:0.9,repeat:Infinity,ease:'linear'}}/>
              <motion.div className="l-txt" animate={{opacity:[0.5,1,0.5]}} transition={{duration:1.5,repeat:Infinity}}>
                Analysing race intelligence…
              </motion.div>
            </div>
          )}

          {!loading&&race&&(<>
            <div className="sec">Race overview</div>
            <motion.div className="grid4" initial="h" animate="s"
              variants={{h:{},s:{transition:{staggerChildren:0.08}}}}>
              {[
                {l:'Race',v:race.race_name,s:race.track+' · '+race.going,sm:true},
                {l:'AI Selection',v:race.top_pick,s:(race.horses[0]?.win_prob)+'% win probability',sm:true,c:'var(--gold)'},
                {l:'Model Confidence',v:race.model_confidence+'%',s:race.model_version},
                {l:'Inference',v:race.inference_ms+'ms',s:race.field_size+' runners',cls:'gr'},
              ].map((m,i)=>(
                <motion.div className="card" key={i}
                  variants={{h:{opacity:0,y:12},s:{opacity:1,y:0}}}
                  whileHover={{y:-2,boxShadow:'var(--shadowH)'}}>
                  <div className="c-lbl">{m.l}</div>
                  <div className={'c-val'+(m.sm?' sm':'')+(m.cls?' '+m.cls:'')} style={m.c?{color:m.c}:{}}>{m.v}</div>
                  <div className="c-sub">{m.s}</div>
                </motion.div>
              ))}
            </motion.div>

            <div className="sec">Field analysis</div>
            <div className="horses">
              {horses.map((h,i)=>(
                <HorseCard key={h.name} horse={h} expanded={expanded===i}
                  onToggle={()=>setExpanded(expanded===i?null:i)} index={i}/>
              ))}
            </div>

            <div className="sec">Intelligence dashboard</div>
            <motion.div className="grid2" initial={{opacity:0,y:14}} animate={{opacity:1,y:0}} transition={{delay:0.3}}>
              <div className="panel">
                <div className="p-title">Model performance</div>
                {ACCURACY.map(([l,v,c])=>(
                  <div className="a-row" key={l}>
                    <span>{l}</span>
                    <span style={{fontWeight:700,color:c}}>{v}</span>
                  </div>
                ))}
              </div>
              <div className="panel">
                <div className="p-title">Win probability — field overview</div>
                {horses.map((h,i)=>(
                  <div className="f-row" key={h.name}>
                    <span className="f-name">{h.name}</span>
                    <div className="f-track">
                      <motion.div className="f-fill" initial={{width:0}}
                        animate={{width:((h.win_prob/maxWin)*100)+'%'}} transition={{duration:0.8,delay:i*0.06}}/>
                    </div>
                    <span className="f-pct">{h.win_prob}%</span>
                  </div>
                ))}
              </div>
            </motion.div>
          </>)}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
